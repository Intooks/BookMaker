<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#254b40"><meta name="description" content="BookMaker — редактор книг с вики, оффлайн-режимом и экспортом."><title>BookMaker</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=911ebbf4c6ded31d"></head>
<body><div class="scenery"></div><header class="topbar"><a class="brand" href="./" aria-label="BookMaker"><span class="brand-icon">B</span><span>Book<span class="brand-light">Maker</span></span></a><button id="library" class="quiet library">Мои книги <span>⌄</span></button><div class="top-spacer"></div><span id="save-status" class="save-status" role="status">Открываем книгу…</span><button id="install" class="quiet" hidden>Установить</button><button id="sync" class="quiet" title="Синхронизация с GitHub"><span class="sync-icon">↻</span> GitHub</button><button id="export" class="primary">Экспорт <span>↗</span></button></header>
<div class="workspace"><aside class="outline panel"><div class="panel-heading"><h2>Рукопись</h2><button class="icon-button" id="book-settings" title="Настройки книги" aria-label="Настройки книги">⚙</button></div><button class="book-root" id="root"><span class="book-symbol">▤</span><span id="book-title"></span></button><div id="tree" class="tree"></div><div class="outline-actions"><button id="add-chapter" class="quiet">＋ Глава</button><button id="add-part" class="quiet">＋ Часть</button></div><div class="outline-bottom"><div class="goal-top"><span>Объём книги</span><span id="total-words"></span></div><div class="goal-track"><div id="goal-progress"></div></div><span id="goal-label"></span><button id="import" class="import-button">↥ Импортировать книгу</button><button id="history" class="quiet history-button">◷ История версий</button></div></aside>
<main class="writing"><div class="editor-top"><nav id="breadcrumb" class="breadcrumb" aria-label="Путь главы"></nav><div class="view-controls"><div class="segmented"><button id="rich-mode" class="active">Текст</button><button id="md-mode">Markdown</button><button id="preview-mode">Чтение</button></div><button id="focus-mode" class="icon-button" aria-label="Режим фокуса" title="Режим фокуса">⛶</button></div></div><div class="toolbar" id="toolbar"><button data-command="bold" title="Жирный (Ctrl+B)"><b>B</b></button><button data-command="italic" title="Курсив (Ctrl+I)"><i>I</i></button><button data-command="underline" title="Подчёркнутый"><u>U</u></button><button data-command="strikeThrough" title="Зачёркнутый"><s>S</s></button><span class="divider"></span><button data-command="formatBlock" data-value="h2" title="Подзаголовок">H₂</button><button data-command="formatBlock" data-value="blockquote" title="Цитата">❞</button><button data-command="insertUnorderedList" title="Список">☷</button><span class="divider"></span><button id="align-center" title="По центру">≡</button><button id="scene-break" title="Разделитель сцен">⁂</button><button id="insert-note" title="Сноска">a¹</button><button id="insert-link" title="Ссылка">↗</button><span class="divider"></span><button id="formatted-paste" title="Вставка с форматированием">▣</button><div class="toolbar-space"></div><button id="format-help" title="Форматирование и теги">?</button><select id="text-size" aria-label="Размер текста"><option value="18">18</option><option value="20" selected>20</option><option value="22">22</option><option value="24">24</option></select></div>
<div class="page-scroll" id="page-scroll"><article class="paper"><div class="chapter-eyebrow" id="chapter-label">Глава</div><input id="chapter-title" class="chapter-title" aria-label="Название главы" placeholder="Название главы"><div id="editor" class="prose" contenteditable="true" spellcheck="true" aria-label="Текст главы" role="textbox" aria-multiline="true"></div><textarea id="markdown" class="markdown-editor" aria-label="Markdown главы" spellcheck="false" hidden></textarea><div id="preview" class="prose" hidden></div><div class="paper-end">✧</div></article></div></main>
<aside class="wiki panel"><div class="panel-heading"><h2>Мир книги</h2><button id="add-wiki" class="icon-button" aria-label="Добавить страницу вики" title="Добавить страницу вики">＋</button></div><label class="wiki-search"><span>⌕</span><input id="wiki-search" placeholder="Поиск в вики" aria-label="Поиск в вики"></label><div class="wiki-categories" id="wiki-categories"></div><div id="wiki-list" class="wiki-list"></div><div id="wiki-detail" class="wiki-detail"></div><div class="wiki-bottom"><span>↗</span><span>Связывайте героев и места<br>с помощью [[Название]]</span></div></aside></div>
<dialog id="modal"><div class="modal-top"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Закрыть">×</button></div><div id="modal-body"></div></dialog><div id="toast" class="toast" role="status" hidden></div><input id="import-file" type="file" accept=".json,.md,.txt,.html,.htm,.fb2,.epub,.zip" hidden><script type="module" src="./app.js?v=4cbf764fd18430c9"></script></body></html>
